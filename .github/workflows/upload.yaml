name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: cos-upload-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false
  queue: max

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn --version

      - name: Set up Calcit and Caps
        uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"

      - name: Resolve immutable dependencies
        run: |
          set -euo pipefail
          # Published dependencies request different compatible js-ffi and
          # Respo versions; Caps records the deterministic highest selections.
          caps --ci
          yarn install --immutable
          caps verify --toolchain

      - name: Validate Calcit upgrade
        run: |
          set -euo pipefail
          calcit edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru analyze check-public \
            --ns docs-workflow.comp.container \
            --ns docs-workflow.config \
            --ns docs-workflow.main \
            --ns docs-workflow.schema \
            --ns docs-workflow.updater \
            --summary-only --format json
          calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru
          calcit calcit.cirru test --require-match --summary-only --format json

      - name: Select CDN asset path
        id: asset-path
        env:
          CDN_ORIGIN: https://cos-sh.tiye.me
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/"
          else
            asset_prefix="${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}/"
          fi
          base_url="${CDN_ORIGIN}/${asset_prefix}"
          echo "VITE_BASE_URL=${base_url}" >> "$GITHUB_ENV"
          echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
          echo "base-url=${base_url}" >> "$GITHUB_OUTPUT"

      - name: Build web assets with CDN URLs
        run: |
          set -euo pipefail
          yarn build

      - name: Install verified mdBook binaries
        run: |
          install -d "$RUNNER_TEMP/mdbook-bin"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/mdbook.tar.gz" \
            https://github.com/rust-lang/mdBook/releases/download/v0.4.14/mdbook-v0.4.14-x86_64-unknown-linux-gnu.tar.gz
          echo "0ed75f6e4115f02d806932c4b1a8d9aca276ea1bbc3979524b4a8847bd3510e4  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook-bin" mdbook
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/mdbook-linkcheck.zip" \
            https://github.com/Michael-F-Bryan/mdbook-linkcheck/releases/download/v0.7.6/mdbook-linkcheck.x86_64-unknown-linux-gnu.zip
          echo "2c478d9754e38be2dbd3ee2fcac629179c6d6146f7e0f1749a5a697030e27c4a  $RUNNER_TEMP/mdbook-linkcheck.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/mdbook-linkcheck.zip" -d "$RUNNER_TEMP/mdbook-bin"
          chmod +x "$RUNNER_TEMP/mdbook-bin/mdbook" "$RUNNER_TEMP/mdbook-bin/mdbook-linkcheck"
          echo "$RUNNER_TEMP/mdbook-bin" >> "$GITHUB_PATH"

      - name: Build mdBook
        run: |
          mdbook build
          mv book/html/index.html book/html/mdbook.html

      - name: Check COS credentials
        id: cos-credentials
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          if [[ -n "$COS_BUCKET" && -n "$COS_SECRET_ID" && -n "$COS_SECRET_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              echo "::warning title=COS upload skipped::Configure COS_BUCKET, COS_SECRET_ID, and COS_SECRET_KEY to run public upload verification."
            else
              echo "::error title=COS credentials missing::COS_BUCKET, COS_SECRET_ID, and COS_SECRET_KEY are required for production deployment."
              exit 1
            fi
          fi

      - name: Upload and verify web assets on COS
        if: steps.cos-credentials.outputs.available == 'true'
        uses: worktools/cos-upload-action@06d6027dcca6413c5936e04a9b6e9f0d5ef71ba0 # v1.2.0
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ steps.asset-path.outputs.prefix }}
          public-base-url: ${{ steps.asset-path.outputs.base-url }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}

      - name: Upload and verify mdBook on COS
        if: steps.cos-credentials.outputs.available == 'true'
        uses: worktools/cos-upload-action@06d6027dcca6413c5936e04a9b6e9f0d5ef71ba0 # v1.2.0
        with:
          source-dir: book/html
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ steps.asset-path.outputs.prefix }}
          public-base-url: ${{ steps.asset-path.outputs.base-url }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}

      - name: Deploy web assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deploy-web
        uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9 # v2.0.0
        env:
          DEPLOY_KEY: ${{ secrets.rsync_private_key }}
        with:
          flags: -avzr --progress
          options: ""
          ssh_options: ""
          src: dist/*
          dest: rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}

      - name: Deploy mdBook
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deploy-mdbook
        uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9 # v2.0.0
        env:
          DEPLOY_KEY: ${{ secrets.rsync_private_key }}
        with:
          flags: -avzr --progress
          options: ""
          ssh_options: ""
          src: book/html/*
          dest: rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}

      - name: Display deployment status
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "web: ${{ steps.deploy-web.outputs.status }}"
          echo "mdBook: ${{ steps.deploy-mdbook.outputs.status }}"
