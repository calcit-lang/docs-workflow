name: Verify published Alerts consumer
on:
  push:
    branches: [prepare/docs-alerts031]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru
      - name: Resolve published formal graph without overlays
        run: |
          set -euo pipefail
          test "$(calcit -v)" = 0.30.1
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          git diff --quiet -- deps.cirru package.json yarn.lock .yarnrc.yml
      - name: Original gates before source change
        run: |
          set -euo pipefail
          mkdir -p acceptance
          calcit --check-only --all-defs --format json > acceptance/check-before.json
          calcit fix --workflow strict --verify --format json | tee acceptance/strict-before.json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit test --require-match --format json | tee acceptance/tests-before.json
          calcit js
          node --test test/navigation.test.mjs | tee acceptance/navigation-before.log
          yarn vite build --base=./
      - name: One guarded official source operation
        run: node apply-reviewed.mjs
      - name: Full gates after source change
        run: |
          set -euo pipefail
          calcit edit format
          test "$(git hash-object calcit.cirru)" = "$(cat acceptance/snapshot-after-blob.txt)"
          calcit --check-only --all-defs --format json > acceptance/check.json
          calcit fix --workflow strict --verify --format json | tee acceptance/strict.json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit test --require-match --format json | tee acceptance/tests.json
          calcit analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'
          calcit analyze weak-types --only dynamic-method --summary-only --format json | jq -e '.data.summary.findings == 0'
          calcit js
          node --test test/navigation.test.mjs | tee acceptance/navigation.log
          yarn vite build --base=./
          git diff --quiet -- test deps.cirru package.json yarn.lock .yarnrc.yml
          cp calcit.cirru acceptance/snapshot.cirru
          cp -R dist acceptance/dist
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: docs-published-alerts-evidence
          path: acceptance
          if-no-files-found: error
          retention-days: 30
